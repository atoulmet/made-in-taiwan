<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet" />
<style>
  @font-face { font-family: 'Alloha'; src: url('./Alloha.ttf') format('truetype'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'S2G Moon'; src: url('./S2G-moon.ttf') format('truetype'); font-weight: 400 900; font-display: swap; unicode-range: U+0-4EFC, U+4EFE-4F5F, U+4F61-5360, U+5362-5563, U+5565-57D4, U+57D6-5975, U+5977-71D8, U+71DA-8524, U+8526-8C92, U+8C94-9EB4, U+9EB6-10FFFF; }
</style>
</helmet>
<div style="width:6.4em;height:6.4em;border-radius:50%;background:#FBF9F1;border:.17em solid #04492C;position:relative;flex:none">
  <div style="position:absolute;inset:.2em;border:.05em solid #04492C;border-radius:50%"></div>
  <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.18em;text-align:center;padding:0 .3em">
    <div style="font-family:'S2G Moon','Noto Sans TC',sans-serif;font-size:1.15em;line-height:1.05;letter-spacing:.03em;white-space:nowrap;color:#04492C">臺灣製造</div>
    <div style="width:2.4em;height:.07em;background:#9E2B20"></div>
    <div style="font-family:Alloha,sans-serif;font-size:.68em;line-height:1;letter-spacing:.04em;white-space:nowrap;color:#9E2B20;text-transform:uppercase">Made in Taiwan</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:260}}"></script>
</body>
</html>
